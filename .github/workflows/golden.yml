name: golden-images

# A/B regression check: build the base ref and the head ref on the SAME runner, render the sample
# photos with the base to create baselines, then compare the head against them. Machine- and
# browser-version differences cancel out because both sides run in this one job.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: "Reference commit/branch (the known-good code)"
        default: "73f13e8"
      head:
        description: "Commit/branch under test"
        default: "main"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base }}
      HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The base is built with ITS OWN dependencies (the two sides can differ, e.g. a package added
      # on main), then rendered by the head's harness against a server for the base build, so
      # both sides are measured by the same harness and the same browser.
      - name: Build the base ref
        run: |
          git worktree add ../base "$BASE_REF"
          cd ../base
          npm ci --no-audit --no-fund
          npm run build

      - name: Render baselines from the base build
        run: |
          npx vite preview --outDir ../base/dist --host 127.0.0.1 --port 4180 --strictPort &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4180/ >/dev/null && break; sleep 1; done
          node tests/golden/run.mjs --update --url http://127.0.0.1:4180/
          mkdir -p tests/golden/out-base
          cp tests/golden/out/*.png tests/golden/out-base/
          kill %1 || true

      - name: Compare the head ref against them
        run: |
          npm run build
          # Intentional visual changes: honoured only when this PR edits the list itself.
          if git diff --name-only "$BASE_REF" "$HEAD_REF" -- tests/golden/expected-changes.txt | grep -q .; then
            node tests/golden/run.mjs --allow-changes tests/golden/expected-changes.txt
          else
            npm run golden
          fi

      - name: Unit tests
        run: npm test

      - name: UI smoke test (services, reset, debug overlay, live camera)
        run: npm run smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-renders
          path: |
            tests/golden/out
            tests/golden/out-base
          if-no-files-found: ignore
